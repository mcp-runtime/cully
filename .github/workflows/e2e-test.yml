name: E2E Test
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    paths-ignore: ['README.md']
  workflow_dispatch:
    inputs:
      published_cli:
        description: Exercise the published CLI from the matching release without replacing it
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CULLY_E2E_PUBLISHED_CLI: ${{ inputs.published_cli || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install, set up and use Cully end to end
        run: bash tests/e2e/setup.sh
