name: E2E Test
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    paths-ignore: ['README.md']
  workflow_dispatch:
    inputs:
      published_cli:
        description: Exercise the published CLI from the matching release without replacing it
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  solo:
    name: Solo setup and memory
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CULLY_E2E_PUBLISHED_CLI: ${{ inputs.published_cli || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install, set up and use Cully end to end
        run: bash tests/e2e/setup.sh
  team:
    name: Team handoff and review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cully_team_e2e
          POSTGRES_USER: cully_test
          POSTGRES_PASSWORD: cully_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cully_test -d cully_team_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CULLY_E2E_TEAM_DATABASE_URL: postgresql://cully_test:cully_test@127.0.0.1:5432/cully_team_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Signed OAuth, production binaries and two-agent Team workflow
        run: go test ./tests/e2e -run '^TestTeam$' -race -count=1 -v
