name: Publish Cully service images
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published Cully release tag
        required: true
        type: string
permissions:
  contents: read
  packages: write
env:
  RELEASE_TAG: ${{ inputs.tag }}
  MCP_IMAGE: ghcr.io/mcp-runtime/cully-mcp:${{ inputs.tag }}
  DATA_IMAGE: ghcr.io/mcp-runtime/cully-data:${{ inputs.tag }}
  MEM0_IMAGE: ghcr.io/mcp-runtime/cully-mem0:${{ inputs.tag }}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Validate release tag
        run: python3 -c 'import os,re; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:[-.][A-Za-z0-9.-]+)?", os.environ["RELEASE_TAG"])'
      - name: Build MCP, data and local-model Mem0 images
        run: |
          docker build -f Dockerfile --build-arg VERSION="$RELEASE_TAG" -t "$MCP_IMAGE" .
          docker build -f Dockerfile.data-api -t "$DATA_IMAGE" .
          docker build -f Dockerfile.mem0 -t "$MEM0_IMAGE" .
      - name: Scan pinned Mem0 image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.MEM0_IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release service images
        run: |
          docker push "$MCP_IMAGE"
          docker push "$DATA_IMAGE"
          docker push "$MEM0_IMAGE"
