version: v1
servers:
    - name: cully
      description: Intelligence around your coding agents
      image: registry.mcpruntime.org/org/cully-mcp/cully
      imageTag: dev
      route: /cully/mcp
      publicPathPrefix: cully
      ingressHost: mcp.mcpruntime.org
      port: 8080
      replicas: 1
      envVars:
        - name: CULLY_DATA_API_URL
          value: https://workspace.mcpruntime.org/cully-data
        - name: CULLY_HOST
          value: 0.0.0.0
        - name: CULLY_PORT
          value: "8080"
        - name: CULLY_MCP_AUTH_MODE
          value: oauth
        - name: CULLY_JWKS_URL
          value: https://auth.mcpruntime.org/mcp-auth/.well-known/jwks.json
      secretEnvVars:
        - name: CULLY_DATA_API_TOKEN
          secretKeyRef:
            name: cully-data-api-token
            key: CULLY_DATA_API_TOKEN
      namespace: mcp-servers
      tools:
        - name: cully_log
          description: cully_log tool
          requiredTrust: low
          sideEffect: write
        - name: cully_search
          description: cully_search tool
          requiredTrust: low
          sideEffect: read
        - name: cully_recall
          description: Semantic recall through self-hosted Mem0
          requiredTrust: low
          sideEffect: read
        - name: cully_recent
          description: cully_recent tool
          requiredTrust: low
          sideEffect: read
        - name: cully_context
          description: cully_context tool
          requiredTrust: low
          sideEffect: read
        - name: cully_session
          description: cully_session tool
          requiredTrust: medium
          sideEffect: write
        - name: cully_session_get
          description: cully_session_get tool
          requiredTrust: low
          sideEffect: read
        - name: cully_get
          description: cully_get tool
          requiredTrust: low
          sideEffect: read
        - name: cully_update
          description: cully_update tool
          requiredTrust: medium
          sideEffect: write
        - name: cully_delete
          description: cully_delete tool
          requiredTrust: high
          sideEffect: destructive
        - name: cully_projects
          description: cully_projects tool
          requiredTrust: low
          sideEffect: read
      auth:
        mode: oauth
        tokenHeader: Authorization
        issuerURL: https://auth.mcpruntime.org/mcp-auth
        audience: https://mcp.mcpruntime.org/cully/mcp
        scopes: [tools:read, tools:write]
      policy:
        mode: observe
        defaultDecision: allow
        enforceOn: call_tool
        policyVersion: v1
      session:
        store: memory
        maxLifetime: 24h
        idleTimeout: 1h
        upstreamTokenHeader: Authorization
      gateway:
        enabled: true
