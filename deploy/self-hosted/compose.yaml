# Complete Docker deployment. OAuth services are optional profiles.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CULLY_DB_NAME:?set CULLY_DB_NAME}
      POSTGRES_USER: ${CULLY_DB_USER:?set CULLY_DB_USER}
      POSTGRES_PASSWORD: ${CULLY_DB_PASSWORD:?set CULLY_DB_PASSWORD}
    ports:
      - 127.0.0.1:${CULLY_DB_PORT:-55393}:5432
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [private, local]
  migrate:
    profiles: [ops]
    build:
      context: ../..
      dockerfile: Dockerfile.data-api
    command: [migrate]
    environment:
      CULLY_DATABASE_URL: ${CULLY_DATABASE_URL:?set CULLY_DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
  data-api:
    build:
      context: ../..
      dockerfile: Dockerfile.data-api
    restart: unless-stopped
    environment:
      CULLY_DATABASE_URL: ${CULLY_DATABASE_URL:?set CULLY_DATABASE_URL}
      CULLY_DATA_API_TOKEN: ${CULLY_DATA_API_TOKEN:?set CULLY_DATA_API_TOKEN}
      CULLY_MEM0_URL: http://mem0:8000
      CULLY_MEM0_API_KEY: ${CULLY_MEM0_API_KEY:?set CULLY_MEM0_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      mem0:
        condition: service_healthy
    ports:
      - 127.0.0.1:${CULLY_DATA_API_PORT:-43393}:8083
    healthcheck:
      test: [CMD, /cully-data, health]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [private, local]
  mcp:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CULLY_HOST: 0.0.0.0
      CULLY_DATA_API_URL: http://data-api:8083
      CULLY_DATA_API_TOKEN: ${CULLY_DATA_API_TOKEN:?set CULLY_DATA_API_TOKEN}
      CULLY_MCP_AUTH_MODE: ${CULLY_MCP_AUTH_MODE:-none}
      CULLY_MCP_OWNER: ${CULLY_MCP_OWNER:-}
      CULLY_AUTH_ISSUER: ${CULLY_AUTH_ISSUER:-}
      CULLY_AUTH_RESOURCE: ${CULLY_AUTH_RESOURCE:-}
      CULLY_JWKS_URL: ${CULLY_JWKS_URL:-}
    depends_on:
      data-api:
        condition: service_healthy
    ports:
      - 127.0.0.1:${CULLY_MCP_PORT:-3393}:8080
    networks: [private, edge]
  mem0-db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: ${CULLY_MEM0_DB_PASSWORD:?set CULLY_MEM0_DB_PASSWORD}
    ports:
      - 127.0.0.1:${CULLY_MEM0_DB_PORT:-56393}:5432
    volumes:
      - mem0-data:/var/lib/postgresql/data
      - ./mem0-init-db.sql:/docker-entrypoint-initdb.d/10-mem0-app.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d postgres']
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [private, local]
  mem0:
    build:
      context: ../..
      dockerfile: Dockerfile.mem0
    restart: unless-stopped
    command: [sh, -c, 'alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000']
    environment:
      POSTGRES_HOST: mem0-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: postgres
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: ${CULLY_MEM0_DB_PASSWORD:?set CULLY_MEM0_DB_PASSWORD}
      POSTGRES_COLLECTION_NAME: cully_memories
      APP_DB_NAME: mem0_app
      HISTORY_DB_PATH: /app/history/history.db
      ADMIN_API_KEY: ${CULLY_MEM0_API_KEY:?set CULLY_MEM0_API_KEY}
      JWT_SECRET: ${CULLY_MEM0_JWT_SECRET:?set CULLY_MEM0_JWT_SECRET}
      AUTH_DISABLED: "false"
      MEM0_TELEMETRY: "false"
    ports:
      - 127.0.0.1:${CULLY_MEM0_PORT:-53393}:8000
    volumes: [mem0-history:/app/history]
    depends_on:
      mem0-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [private, edge]
  caddy:
    profiles: [oauth]
    image: caddy:2
    restart: unless-stopped
    environment:
      CULLY_MCP_HOST: ${CULLY_MCP_HOST:-}
      CULLY_AUTH_HOST: ${CULLY_AUTH_HOST:-}
    volumes:
      - ./Caddyfile.new-auth:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports: ["80:80", "443:443"]
    networks: [edge]
  mcp-auth:
    profiles: [mcp-auth]
    image: princekrroshan01/mcp-auth-server:0.4.4
    restart: unless-stopped
    environment:
      MCP_AUTH_ISSUER: ${CULLY_AUTH_ISSUER:-}
      MCP_AUTH_RESOURCES: ${CULLY_AUTH_RESOURCE:-}
      MCP_AUTH_RESOURCE_SCOPES: '{"${CULLY_AUTH_RESOURCE:-}":["tools:read","tools:write"]}'
      MCP_AUTH_CONNECTORS_FILE: /etc/mcp-auth/connectors.json
      MCP_AUTH_CONNECTOR: ${CULLY_MCP_AUTH_CONNECTOR:-keycloak}
      MCP_AUTH_PRIVATE_KEY_FILE: /run/secrets/signing_key
      MCP_AUTH_STORE: sqlite
      MCP_AUTH_DATABASE_URL: /var/lib/mcp-auth/state.db
      MCP_AUTH_REGISTRATION_ENABLED: "true"
      MCP_AUTH_REQUIRE_HTTPS: "true"
      MCP_AUTH_TRUST_PROXY_TLS: "true"
      MCP_AUTH_UPSTREAM_CLIENT_SECRET: ${MCP_AUTH_UPSTREAM_CLIENT_SECRET:-}
    secrets: [signing_key]
    volumes:
      - ./connectors.json:/etc/mcp-auth/connectors.json:ro
      - auth-state:/var/lib/mcp-auth
    expose: ["8080"]
    networks: [edge]
volumes:
  db-data:
  mem0-data:
  mem0-history:
  caddy-data:
  caddy-config:
  auth-state:
secrets:
  signing_key:
    file: ./.secrets/signing-key.pem
networks:
  private:
    internal: true
  # Only loopback-published services join this network; Caddy and MCP Auth cannot reach them.
  local:
  edge:
