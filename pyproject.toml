[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buddy-mcp"
version = "0.1.0"
description = "OAuth-protected MCP work memory backed by PostgreSQL and pgvector"
requires-python = ">=3.11"
dependencies = [
  "mcp==1.29.1",
  "PyJWT[crypto]==2.10.1",
  "psycopg[binary,pool]==3.2.9",
]

[project.scripts]
buddy-mcp = "buddy_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["buddy_mcp*"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
